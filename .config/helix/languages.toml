# 依赖: npm i -g dockerfile-language-server-nodejs
# ==========================================
[[language]]
name = "dockerfile"
language-servers = ["docker-langserver"]
auto-format = false

# ==========================================
# Go
# 依赖: go install golang.org/x/tools/gopls@latest
# ==========================================
[[language]]
name = "go"
language-servers = ["gopls"]
auto-format = false

# ==========================================
# Lua
# 依赖: mise use -g lua-language-server@latest 或系统包管理器安装
# ==========================================
[[language]]
name = "lua"
language-servers = ["lua-language-server"]
auto-format = false
