# ==========================================
# Python
# Pyright: 补全、跳转、引用、rename、类型分析
# Ruff: lint、code action、格式化
# 依赖: uv tool install pyright ruff
# uv 项目建议在项目 pyproject.toml 中配置:
# [tool.pyright]
# venvPath = "."
# venv = ".venv"
# ==========================================
[[language]]
name = "python"
language-servers = [
  { name = "pyright", except-features = ["format"] },
  { name = "ruff", only-features = ["diagnostics", "code-action"] },
]
formatter = { command = "ruff", args = ["format", "--stdin-filename", "%{buffer_name}", "-"] }
auto-format = true

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"
autoSearchPaths = true
useLibraryCodeForTypes = true

[language-server.ruff]
command = "ruff"
args = ["server"]

# ==========================================
# Rust (默认开箱即用，主要开启高级 Inlay Hints)
# 依赖: rustup component add rust-analyzer
# ==========================================
[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer.config.rust-analyzer]
cargo.buildScripts.enable = true
inlayHints.bindingModeHints.enable = true
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
inlayHints.typeHints.hideNamedConstructor = true

# ==========================================
# Shell
# 依赖: npm i -g bash-language-server && go install mvdan.cc/sh/v3/cmd/shfmt@latest
# ==========================================
[[language]]
name = "bash"
language-servers = ["bash-language-server"]
formatter = { command = "shfmt", args = ["-i", "2", "-"] }
auto-format = false

# ==========================================
# Markdown
# 依赖: npm i -g marksman prettier
# ==========================================
[[language]]
name = "markdown"
language-servers = ["marksman"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }
auto-format = false

