line_nr = "#b06f92"
selection = "#6f4a62"
selection_primary = "#875574"
cursorline = "#3b2b37"
highlight = "#56384d"

secondary_cursor = "#ffc4df"
secondary_cursor_select = "#d6b0ff"
secondary_cursor_normal = "#ffc4df"
secondary_cursor_insert = "#91ead3"
